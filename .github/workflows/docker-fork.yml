name: Build fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'leeclissett/karakeep'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          build-args: SERVER_VERSION=fork-${{ github.sha }}
          tags: |
            ghcr.io/leeclissett/karakeep:latest
            ghcr.io/leeclissett/karakeep:fork
            ghcr.io/leeclissett/karakeep:fork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
