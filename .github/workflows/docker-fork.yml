name: Build fork image
on:
  push:
    branches: [lee]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          build-args: SERVER_VERSION=fork-${{ github.sha }}
          # Floating tags only move on pushes to lee. A workflow_dispatch on
          # any other branch (e.g. to test a PR) publishes fork-<sha> only.
          tags: |
            ghcr.io/leeclissett/karakeep:fork-${{ github.sha }}
            ${{ github.ref == 'refs/heads/lee' && 'ghcr.io/leeclissett/karakeep:fork' || '' }}
            ${{ github.ref == 'refs/heads/lee' && 'ghcr.io/leeclissett/karakeep:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: |
          echo "ghcr.io/leeclissett/karakeep:fork-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
