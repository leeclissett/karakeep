name: Build fork image
on:
  push:
    branches: [lee]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          build-args: SERVER_VERSION=fork-${{ github.sha }}
          tags: |
            ghcr.io/leeclissett/karakeep:latest
            ghcr.io/leeclissett/karakeep:fork
            ghcr.io/leeclissett/karakeep:fork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
